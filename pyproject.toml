[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "omnibots"
version = "0.8.0"
description = "OmniBots: a local multi-agent team (the Guild) with a PySide6 desktop app and tray."
requires-python = ">=3.12"
readme = "README.md"
# Exact pins: see requirements.lock for the full resolved set.
dependencies = [
    "PySide6==6.11.2",
    "keyring==25.7.0",
    "pywin32==312; sys_platform == 'win32'",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "pypdf==6.19.0",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "python-pptx==1.0.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["omnibots*"]

[tool.setuptools.package-data]
"omnibots.db" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
