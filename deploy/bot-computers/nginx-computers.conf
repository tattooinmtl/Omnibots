# /etc/nginx/sites-available/computers.globalwarningnetworks.com
# certbot --nginx adds TLS after DNS points here. The websocket upgrade is for the live screen.
limit_req_zone $binary_remote_addr zone=botcomp:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name computers.globalwarningnetworks.com;
    client_max_body_size 60m;

    location / {
        limit_req zone=botcomp burst=60 nodelay;
        proxy_pass http://127.0.0.1:8898;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
