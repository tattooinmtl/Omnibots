# /etc/nginx/sites-available/search.globalwarningnetworks.com
# certbot --nginx adds the 443/TLS part after DNS points here.
limit_req_zone $binary_remote_addr zone=search_gw:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name search.globalwarningnetworks.com www.search.globalwarningnetworks.com;

    client_max_body_size 16k;

    location / {
        limit_req zone=search_gw burst=20 nodelay;
        proxy_pass http://127.0.0.1:8899;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 40s;
    }
}
